<!doctype html>
<html lang="uk" data-theme="aurora">
<head>
  <meta charset="utf-8">
  <title>Outlay</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#060913">
  <meta name="description" content="Outlay — особиста аналітика витрат за карткою Monobank">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <script>
    /* Apply the saved theme before first paint, so there is no flash of the wrong theme. */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('outlay.prefs.v1') || '{}');
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var d = document.documentElement;
        d.dataset.theme = p.theme && p.theme !== 'auto' ? p.theme : (dark ? 'aurora' : 'daylight');
        d.lang = p.lang === 'en' ? 'en' : 'uk';
        if (typeof p.accent === 'number') d.style.setProperty('--accent-h-user', String(p.accent));
        if (p.density) d.dataset.density = p.density;
        if (p.privacy) d.dataset.privacy = 'on';
        if (p.motion) d.dataset.motion = p.motion;
      } catch (e) { /* storage unavailable: defaults apply */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Для роботи Outlay потрібен JavaScript. · Outlay needs JavaScript to run.</noscript>
</body>
</html>
